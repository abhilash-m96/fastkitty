[project]
name = "fastkitty"
version = "0.1.0"
description = "A production-ready, multi-tenant SaaS foundation for FastAPI with explicit tenancy, dynamic dependency injection, and clean architecture."
readme = "README.md"
authors = [
    { name = "Abhilash M" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = [
    "fastapi",
    "multi-tenant",
    "multitenancy",
    "saas",
    "postgresql",
    "sqlalchemy",
    "alembic",
    "logfire",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "pyjwt>=2.15.1",
    "python-consul2>=0.1.5",
    "hvac>=2.4.0",
    "alembic>=1.20.0",
    "logfire[fastapi,sqlalchemy]>=5.1.1",
]

[project.urls]
Homepage = "https://github.com/abhilash-m96/fastkitty"
Documentation = "https://abhilash-m96.github.io/fastkitty/"
Repository = "https://github.com/abhilash-m96/fastkitty"
Issues = "https://github.com/abhilash-m96/fastkitty/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.logfire]
ignore_no_config = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["api*", "config*", "db*", "models*", "schemas*", "services*"]
exclude = ["tests*", "docker*", "docs*", "alembic*", "site*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"



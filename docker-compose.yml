services:
  postgres:
    image: postgres:16-alpine
    container_name: fastkitty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastkitty-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TENANCY_DB_STRATEGY: ${TENANCY_DB_STRATEGY:-database}
      TENANCY_CONFIG_CONNECTION: '${TENANCY_CONFIG_CONNECTION:-{"type": "file", "path": "tenants_config.json"}}'
      TENANCY_SECRETS_CONNECTION: '${TENANCY_SECRETS_CONNECTION:-{"type": "file", "path": "tenants_secrets.docker.json"}}'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    profiles:
      - full

volumes:
  postgres_data:
